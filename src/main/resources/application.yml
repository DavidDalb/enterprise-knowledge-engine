spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_knowledge_engine_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  ai:
    openai:
      base-url: https://openrouter.ai/api/v1
      chat:
        model: deepseek/deepseek-chat
      api-key: ${OPENROUTER_API_KEY}
