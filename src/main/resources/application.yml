spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_knowledge_engine_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    logging:
      level:
        org.flywaydb: DEBUG
  ai:
   ollama:
      chat:
        temperature: 0.7