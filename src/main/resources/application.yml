spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_knowledge_engine_db
    username: raguser
    password: ragpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    level:
        org.flywaydb: DEBUG
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
         model: llama3.2:1b
         temperature: 0.7